<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- menambahkan viewport (J3)-->
  <title>SIMPUS-Mini | Daftar Anggota</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <header>
    <h1>📚 SIMPUS-Mini</h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label> <!-- Tombol navigasi (J3)-->
    <form class="search-form" onsubmit="return false;">
      <input type="text" id="searchInput" class="search-input" placeholder="Cari...">
    </form>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="../buku/list.html">Daftar Buku</a></li>
        <li data-role="petugas-only"><a href="../buku/tambah.html">Tambah Buku</a></li>
        <li data-role="petugas-only"><a href="list.html">Daftar Anggota</a></li>
        <li data-role="petugas-only"><a href="tambah.html">Tambah Anggota</a></li>
        <li data-role="petugas-only"><a href="../transaksi/pinjam.html">Peminjaman</a></li>
        <li data-role="petugas-only"><a href="../transaksi/kembalikan.html">Pengembalian</a></li>

        <li class="profile-dropdown">
            <a href="#" class="profile-btn" onclick="toggleProfile(event)">
                <span class="nav-user-badge"></span> ▼
            </a>
            <div id="dropdownMenu" class="profile-dropdown-content">
                <a href="#" onclick="alert('Fitur Profile sedang dalam pengembangan.'); return false;">👤 Lihat Profile</a>
                <a href="../akun/login.html" class="logout" style="color: red !important;">🚪 Logout</a>
            </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Daftar Anggota</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>No. Anggota</th>
              <th>Nama</th>
              <th>Alamat</th>
              <th>No. HP</th>
              <th>Tanggal Bergabung</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="daftar-anggota"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SIMPUS-Mini &mdash; Moch Galih Putra Pratama</p>
  </footer>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/anggota.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.SIMPUS.requirePetugas();
    });
  </script>
  <script> <!-- Fungsi Search-->
    document.getElementById('searchInput').addEventListener('input', function() {
        const keyword = this.value.toLowerCase();
        const rows = document.querySelectorAll('table tbody tr');
        rows.forEach(row => {
            const nama = row.children[1].textContent.toLowerCase();
            row.style.display = nama.includes(keyword) ? '' : 'none';
        });
    });
  </script>
  <script> <!-- Fungsi Select Row-->
    const rows = document.querySelectorAll('table tbody tr');
    rows.forEach(row => {
        row.addEventListener('click', (e) => {
            // Cegah error jika mengklik tombol di dalam tabel
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'I') return;
            
            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
        });
    });

    /* SCRIPT TAMBAHAN UNTUK DROPDOWN PROFIL */
    function toggleProfile(e) {
        e.preventDefault();
        document.getElementById("dropdownMenu").classList.toggle("show-dropdown");
    }

    // Menutup dropdown jika user mengklik area lain di luar tombol
    window.onclick = function(event) {
        if (!event.target.matches('.profile-btn') && !event.target.closest('.profile-btn')) {
            var dropdowns = document.getElementsByClassName("profile-dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show-dropdown')) {
                    openDropdown.classList.remove('show-dropdown');
                }
            }
        }
    }
  </script>
</body>
</html>
