<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- menambahkan viewport (J3)-->
  <title>SIMPUS-Mini | Daftar Anggota</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <header>
    <h1>📚 SIMPUS-Mini</h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label> <!-- Tombol navigasi (J3)-->
    <form class="search-form" onsubmit="return false;">
      <input type="text" id="searchInput" class="search-input" placeholder="Cari...">
    </form>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="list.html">Daftar Anggota</a></li>
        <li><a href="tambah.html">Tambah Anggota</a></li>
        <li><a href="../buku/list.html">Daftar Buku</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Daftar Anggota</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>No. Anggota</th>
              <th>Nama</th>
              <th>Alamat</th>
              <th>No. HP</th>
              <th>Tanggal Bergabung</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>A001</td>
              <td>Siti Aminah</td>
              <td>Malang</td>
              <td>0812xxxx</td>
              <td>2024-01-15</td>
              <td>
                <button type="button" class="btn-icon btn-edit"><i class="bi bi-pencil-fill"></i></button>
                <button type="button" class="btn-icon btn-delete"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>
            <tr>
              <td>A002</td>
              <td>Budi Santoso</td>
              <td>Batu</td>
              <td>0813xxxx</td>
              <td>2024-03-02</td>
              <td>
                <button type="button" class="btn-icon btn-edit"><i class="bi bi-pencil-fill"></i></button>
                <button type="button" class="btn-icon btn-delete"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
  </footer>
  <script> <!-- Fungsi Search-->
    document.getElementById('searchInput').addEventListener('input', function() {
        const keyword = this.value.toLowerCase();
        const rows = document.querySelectorAll('table tbody tr');
        rows.forEach(row => {
            const nama = row.children[1].textContent.toLowerCase();
            row.style.display = nama.includes(keyword) ? '' : 'none';
        });
    });
  </script>
  <script> <!-- Fungsi Select Row-->
    const rows = document.querySelectorAll('table tbody tr');
    rows.forEach(row => {
        row.addEventListener('click', () => {
            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
        });
    });
  </script>
</body>
</html>
