<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digipus | Daftar Buku</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <header>
    <h1>📚 Digipus</h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    <form class="search-form" onsubmit="return false;">
      <input type="text" id="searchInput" class="search-input" placeholder="Cari...">
    </form>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="list.html">Daftar Buku</a></li>
        <li data-role="petugas-only"><a href="tambah.html">Tambah Buku</a></li>
        <li data-role="petugas-only"><a href="../anggota/list.html">Daftar Anggota</a></li>
        <li data-role="petugas-only"><a href="../transaksi/pinjam.html">Peminjaman</a></li>
        <li data-role="petugas-only"><a href="../transaksi/kembalikan.html">Pengembalian</a></li>

        <li class="profile-dropdown">
            <a href="#" class="profile-btn" onclick="toggleProfile(event)">
                <span class="nav-user-badge"></span> ▼
            </a>
            <div id="dropdownMenu" class="profile-dropdown-content">
                <a href="#" onclick="alert('Fitur Profile sedang dalam pengembangan.'); return false;">👤 Lihat Profile</a>
                <a href="../akun/login.html" class="logout" style="color: red !important;">🚪 Logout</a>
            </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Daftar Buku</h2>
      <p data-role="tamu-only" style="margin-bottom:1rem; color:#8a7a6d;">Katalog buku perpustakaan. Untuk meminjam, silakan hubungi petugas.</p>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Judul</th>
              <th>Pengarang</th>
              <th>Tahun</th>
              <th>Stok</th>
              <th class="aksi-petugas">Aksi</th>
            </tr>
          </thead>
          <tbody id="daftar-buku"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Digipus &mdash; Moch Galih Putra Pratama</p>
  </footer>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/buku.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.SIMPUS.requireLogin();
    });
  </script>
  <script> <!-- Fungsi Search-->
    document.getElementById('searchInput').addEventListener('input', function() {
        const keyword = this.value.toLowerCase();
        const rows = document.querySelectorAll('table tbody tr');
        rows.forEach(row => {
            const judul = row.children[0].textContent.toLowerCase();
            row.style.display = judul.includes(keyword) ? '' : 'none';
        });
    });
  </script>
  <script> <!-- Fungsi Select Row-->
    document.querySelectorAll('table tbody tr').forEach(row => {
        row.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'I') return; // Memastikan klik di tombol icon tidak memicu select row

            document.querySelectorAll('table tbody tr').forEach(r => r.classList.remove('selected'));
            this.classList.add('selected');
        });
    });

    function toggleProfile(e) {
        e.preventDefault();
        document.getElementById("dropdownMenu").classList.toggle("show-dropdown");
    }

    window.onclick = function(event) {
        if (!event.target.matches('.profile-btn') && !event.target.closest('.profile-btn')) {
            var dropdowns = document.getElementsByClassName("profile-dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show-dropdown')) {
                    openDropdown.classList.remove('show-dropdown');
                }
            }
        }
    }
  </script>
</body>
</html>
