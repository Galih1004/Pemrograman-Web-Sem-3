<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- menambahkan viewport (J3)-->
  <title>SIMPUS-Mini | Tambah Buku</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>📚 SIMPUS-Mini</h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label> <!-- Tombol navigasi (J3)-->
    <form class="search-form" onsubmit="return false;">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari...">
    </form>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="list.html">Daftar Buku</a></li>
        <li data-role="petugas-only"><a href="tambah.html">Tambah Buku</a></li>
        <li data-role="petugas-only"><a href="../anggota/list.html">Daftar Anggota</a></li>
        <li data-role="petugas-only"><a href="../transaksi/pinjam.html">Peminjaman</a></li>
        <li data-role="petugas-only"><a href="../transaksi/kembalikan.html">Pengembalian</a></li>

        <li class="profile-dropdown">
            <a href="#" class="profile-btn" onclick="toggleProfile(event)">
                <span class="nav-user-badge"></span> ▼
            </a>
            <div id="dropdownMenu" class="profile-dropdown-content">
                <a href="#" onclick="alert('Fitur Profile sedang dalam pengembangan.'); return false;">👤 Lihat Profile</a>
                <a href="../akun/login.html" class="logout" style="color: red !important;">🚪 Logout</a>
            </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Tambah Buku Baru</h2>
      <form id="form-tambah">
        <p>
          <label for="judul">Judul</label><br>
          <input type="text" id="judul" name="judul" required>
        </p>
        <p>
          <label for="pengarang">Pengarang</label><br>
          <input type="text" id="pengarang" name="pengarang" required>
        </p>
        <p>
          <label for="tahun">Tahun Terbit</label><br>
          <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
        </p>
        <p>
          <label for="isbn">ISBN</label><br>
          <input type="text" id="isbn" name="isbn">
        </p>
        <p>
          <label for="stok">Stok</label><br>
          <input type="number" id="stok" name="stok" min="0" required>
        </p>
        <p>
          <label for="kategori">Kategori</label><br>
          <select id="kategori" name="kategori">
            <option value="fiksi">Fiksi</option>
            <option value="non-fiksi">Non-Fiksi</option>
            <option value="referensi">Referensi</option>
          </select>
        </p>
        <p>
          <button type="submit">Simpan</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SIMPUS-Mini &mdash; Moch Galih Putra Pratama</p>
  </footer>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/buku.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.SIMPUS.requirePetugas();
    });

    function toggleProfile(e) {
        e.preventDefault();
        document.getElementById("dropdownMenu").classList.toggle("show-dropdown");
    }

    window.onclick = function(event) {
        if (!event.target.matches('.profile-btn') && !event.target.closest('.profile-btn')) {
            var dropdowns = document.getElementsByClassName("profile-dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show-dropdown')) {
                    openDropdown.classList.remove('show-dropdown');
                }
            }
        }
    }
  </script>
</body>
</html>
